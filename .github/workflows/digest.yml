name: 晚霞预报-常规检查

# 每 6 小时检查一次。只在当天评分达到阈值时推送。
# 注意 cron 用 :12 而非整点：官方文档说 schedule 在高峰期会延迟，
# 并建议错开整点来降低延迟概率。

on:
  schedule:
    - cron: '12 */6 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:        # 手动触发按钮，方便调试

permissions:
  contents: write           # 用于回写 state.json

concurrency:
  group: sunset-glow        # 与 alert 任务互斥，避免同时提交 state.json 冲突
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行检查
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 sunset_glow.py --mode digest

      - name: 回写去重状态
        run: |
          git config user.name  "sunset-glow-bot"
          git config user.email "sunset-glow-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json 无变化，不提交"
          else
            git commit -m "chore: 更新推送状态 [skip ci]"
            git push
          fi
