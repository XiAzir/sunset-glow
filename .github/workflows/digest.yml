name: 晚霞预报-常规检查

# 每 6 小时检查一次。只在当天评分达到阈值时推送。
#
# cron 用 UTC（GitHub 的 schedule 只认 UTC，官方文档没有 timezone 字段）。
# 换算：北京 06:12 / 12:12 / 18:12 / 00:12  =>  UTC 22:12 / 04:12 / 10:12 / 16:12
# 即下面的 `12 4,10,16,22 * * *`（小时列表排序后书写，仅便于阅读）。
#
# 用 :12 而非整点：官方原文说 schedule 在高峰期会延迟、排队任务甚至可能被丢弃，
# 并建议 "schedule your workflow to run at a different time of the hour"。

on:
  schedule:
    - cron: '12 4,10,16,22 * * *'
  workflow_dispatch:        # 手动触发按钮，方便调试
    inputs:
      test_push:
        description: '勾选后发送一条真实测试推送（忽略高分阈值），用于验证微信能收到'
        type: boolean
        default: false

permissions:
  contents: write           # 用于回写 state.json

concurrency:
  group: sunset-glow        # 与 alert 任务互斥，避免同时提交 state.json 冲突
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行检查
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ "${{ inputs.test_push }}" = "true" ]; then
            echo "手动测试模式：发送真实推送（不写状态文件）"
            python3 sunset_glow.py --mode test
          else
            python3 sunset_glow.py --mode digest
          fi

      - name: 回写去重状态
        if: ${{ inputs.test_push != true }}
        run: |
          git config user.name  "sunset-glow-bot"
          git config user.email "sunset-glow-bot@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "state.json 无变化，不提交"
          else
            git commit -m "chore: 更新推送状态 [skip ci]"
            git push
          fi
